name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          msg=$(grep -A 12 "What went wrong" build.log | grep -v "^\s*$" | tr '\n' ' ' | cut -c1-3000)
          echo "::error::$msg"
          grep -E "error:|e: " build.log | head -5 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CameraLightMeter.apk

      - name: Publish as a release (easy to download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Camera Light Meter build ${{ github.run_number }}
          files: CameraLightMeter.apk
