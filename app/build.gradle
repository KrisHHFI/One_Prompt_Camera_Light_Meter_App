plugins {
    id 'com.android.application'
}

android {
    namespace 'app.cameralightmeter'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cameralightmeter'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: uses only Android's built-in Camera2 API.
